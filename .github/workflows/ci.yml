name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_talent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsp -d fsp_talent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fsp:fsp@localhost:5432/fsp_talent
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Зависимости
        run: pip install -e ".[dev]"
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
          ruff check --config pyproject.toml ../scripts
          ruff format --config pyproject.toml --check ../scripts
      - name: mypy
        run: mypy
      - name: Миграции
        run: alembic upgrade head && alembic check
      - name: OpenAPI актуален
        run: python ../scripts/export_openapi.py --check
      - name: pytest
        run: pytest

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Есть ли фронтенд
        id: check
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json нет — шаги фронтенда пропущены"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "20"
      - name: npm ci
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint
      - name: typecheck
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck
      - name: test
        if: steps.check.outputs.exists == 'true'
        run: npm test -- --run
      - name: build
        if: steps.check.outputs.exists == 'true'
        run: npm run build
